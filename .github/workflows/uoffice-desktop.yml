# UnoWord / UnoCalc / UnoShow as native desktop apps (pc64/uoffice/desktop).
#
# Every platform: build, replay the smoke test (sanitized where the toolchain
# has it), build the installers, then INSTALL each installer on a clean-ish
# system and launch the installed app - a package that builds but does not
# install is the failure this exists to catch.
#
#   Windows  NSIS installer + portable ZIP
#   macOS    DMG (universal: arm64 + x86_64)
#   Linux    .deb (installed on Ubuntu) + .rpm (installed on Fedora) + .tar.gz
#
# A tag uoffice-v* runs this through uoffice-release.yml, which also publishes a
# GitHub release (the release job below only runs for a tag ref).
name: uoffice-desktop

on:
  push:
    # branches only: a tag push goes through uoffice-release.yml, and a
    # second run here would race it to publish the same release
    branches: ['**']
    paths:
      - 'pc64/uoffice/**'
      - 'pc64/apps/uo*.c'
      - 'pc64/fb.c'
      - 'pc64/fb.h'
      - 'pc64/pc64_font.*'
      - 'pc64/pc64_icons.*'
      - 'pc64/fonts/**'
      - 'unoui/**'
      - 'unodoc/**'
      - 'unomedia/**'
      - '.github/workflows/uoffice-desktop.yml'
  pull_request:
    paths:
      - 'pc64/uoffice/**'
      - 'pc64/apps/uo*.c'
      - 'unoui/**'
      - 'unodoc/**'
      - 'unomedia/**'
      - '.github/workflows/uoffice-desktop.yml'
  workflow_dispatch:
  workflow_call:          # uoffice-release.yml, on a uoffice-v* tag

jobs:
  # ---------------------------------------------------------------- Linux ----
  linux:
    # the oldest supported LTS, so the packages' glibc floor is 2.35
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain - Xlib + libdbus are all we link - and rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libdbus-1-dev xvfb rpm desktop-file-utils
      - name: build (ASan + UBSan)
        working-directory: pc64/uoffice/desktop
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DUODESK_SANITIZE=ON
          cmake --build build-asan -j
      - name: smoke (sanitized)
        working-directory: pc64/uoffice/desktop
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: xvfb-run -a tests/smoke.sh "$PWD/build-asan"
      - name: build (release)
        working-directory: pc64/uoffice/desktop
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: smoke (release)
        working-directory: pc64/uoffice/desktop
        run: xvfb-run -a tests/smoke.sh "$PWD/build"
      - name: package
        working-directory: pc64/uoffice/desktop/build
        run: |
          cpack
          dpkg-deb -I unooffice_*.deb
          rpm -qip unooffice-*.rpm
      - name: install the .deb and launch it
        working-directory: pc64/uoffice/desktop/build
        run: |
          sudo apt-get install -y ./unooffice_*.deb
          for a in unoword unocalc unoshow; do
            xvfb-run -a /usr/bin/$a --shot /tmp/$a.ppm
            test -s /tmp/$a.ppm
          done
          desktop-file-validate /usr/share/applications/org.unodos.*.desktop
          # the file associations: dpkg's trigger has indexed our MIME types
          grep -E "^application/msword=.*org\.unodos\.UnoWord\.desktop" /usr/share/applications/mimeinfo.cache
          grep -E "^application/vnd\.ms-excel=.*org\.unodos\.UnoCalc\.desktop" /usr/share/applications/mimeinfo.cache
          grep -E "^application/vnd\.ms-powerpoint=.*org\.unodos\.UnoShow\.desktop" /usr/share/applications/mimeinfo.cache
          # and the entry's Exec line opens the file it is handed
          cp ../smoke-out/docs/Document1.doc /tmp/Document1.doc
          xvfb-run -a /usr/bin/unoword --script "$PWD/../tests/assoc_word.txt" /tmp/Document1.doc
          sudo apt-get remove -y unooffice
      - uses: actions/upload-artifact@v4
        with:
          name: UnoOffice-linux
          path: |
            pc64/uoffice/desktop/build/unooffice_*.deb
            pc64/uoffice/desktop/build/unooffice-*.rpm
            pc64/uoffice/desktop/build/UnoOffice-*.tar.gz

  rpm-install:
    needs: linux
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UnoOffice-linux
      - name: install the .rpm on Fedora and launch it
        run: |
          dnf install -y ./unooffice-*.rpm xorg-x11-server-Xvfb
          Xvfb :9 & sleep 2
          for a in unoword unocalc unoshow; do
            DISPLAY=:9 /usr/bin/$a --shot /tmp/$a.ppm
            test -s /tmp/$a.ppm
          done
          rpm -e unooffice

  # -------------------------------------------------------------- Windows ----
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
      - name: build (release, static C runtime)
        working-directory: pc64/uoffice/desktop
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc"
          cmake --build build
          objdump -p build/UnoWord.exe | grep "DLL Name"
          # nothing but Windows' own DLLs
          ! objdump -p build/UnoWord.exe | grep "DLL Name" | grep -viE "kernel32|user32|gdi32|comdlg32|shell32|msvcrt|ucrt|api-ms-win"
      - name: smoke
        working-directory: pc64/uoffice/desktop
        run: tests/smoke.sh "$PWD/build" .exe
      - name: package
        working-directory: pc64/uoffice/desktop/build
        run: |
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          cpack -G "NSIS;ZIP"
          ls -la UnoOffice-*
      - name: install silently, launch, uninstall
        shell: pwsh
        working-directory: pc64/uoffice/desktop/build
        run: |
          $inst = Get-ChildItem UnoOffice-*-windows-x64.exe | Select-Object -First 1
          Start-Process $inst.FullName -ArgumentList '/S' -Wait
          $dir = "$env:ProgramFiles\UnoOffice"
          foreach ($a in 'UnoWord','UnoCalc','UnoShow') {
            if (-not (Test-Path "$dir\$a.exe")) { throw "$a.exe not installed" }
            $p = Start-Process "$dir\$a.exe" -ArgumentList "--shot","$env:TEMP\$a.ppm" -Wait -PassThru
            if ($p.ExitCode -ne 0 -or -not (Test-Path "$env:TEMP\$a.ppm")) { throw "$a did not run" }
          }
          # The file associations (packaging/assoc.nsh): the ProgID's open
          # command is registered, .doc lists it under Open With, and that
          # command - run the way Explorer runs it - opens the document.
          $root = 'HKLM:\Software\Classes'
          if (-not (Test-Path "$root\UnoOffice.UnoWord.Document")) { $root = 'HKCU:\Software\Classes' }
          foreach ($p in 'UnoWord.Document','UnoCalc.Document','UnoShow.Document') {
            if (-not (Test-Path "$root\UnoOffice.$p\shell\open\command")) { throw "ProgID UnoOffice.$p missing" }
          }
          foreach ($x in @{e='.doc';a='UnoWord'},@{e='.xlsx';a='UnoCalc'},@{e='.pptx';a='UnoShow'}) {
            $v = Get-ItemProperty "$root\$($x.e)\OpenWithProgids" -Name "UnoOffice.$($x.a).Document" -ErrorAction SilentlyContinue
            if (-not $v) { throw "$($x.e) does not offer $($x.a)" }
          }
          $cmd = (Get-ItemProperty "$root\UnoOffice.UnoWord.Document\shell\open\command").'(default)'
          Write-Host "open command: $cmd"
          $doc = Resolve-Path ..\smoke-out\docs\Document1.doc
          $exe = ($cmd -split '"')[1]
          $p = Start-Process $exe -ArgumentList "--script",(Resolve-Path ..\tests\assoc_word.txt),"`"$doc`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the registered open command did not open the document" }
          # all-users or per-user, depending on how NSIS ran
          $lnk = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs",
                               "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" `
                               -Recurse -Include UnoWord.lnk,UnoCalc.lnk,UnoShow.lnk -ErrorAction SilentlyContinue
          $lnk | ForEach-Object { $_.FullName }
          if ($lnk.Count -lt 3) {
            Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu","$env:APPDATA\Microsoft\Windows\Start Menu" `
              -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -gt (Get-Date).AddMinutes(-15) } |
              ForEach-Object { $_.FullName }
            throw "Start menu entries missing"
          }
          Start-Process "$dir\Uninstall.exe" -ArgumentList '/S' -Wait
          Start-Sleep 5
          if (Test-Path "$dir\UnoWord.exe") { throw "uninstall left files" }
          if (Test-Path "$root\UnoOffice.UnoWord.Document") { throw "uninstall left the ProgID" }
          $v = Get-ItemProperty "$root\.doc\OpenWithProgids" -Name "UnoOffice.UnoWord.Document" -ErrorAction SilentlyContinue
          if ($v) { throw "uninstall left .doc's Open With entry" }
      - uses: actions/upload-artifact@v4
        with:
          name: UnoOffice-windows
          path: |
            pc64/uoffice/desktop/build/UnoOffice-*-windows-x64.exe
            pc64/uoffice/desktop/build/UnoOffice-*-windows-x64.zip

  # ---------------------------------------------------------------- macOS ----
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: build (ASan + UBSan)
        working-directory: pc64/uoffice/desktop
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DUODESK_SANITIZE=ON
          cmake --build build-asan -j
      - name: smoke (sanitized)
        working-directory: pc64/uoffice/desktop
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: tests/smoke.sh "$PWD/build-asan"
      - name: build (release, universal)
        working-directory: pc64/uoffice/desktop
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build -j
          lipo -info build/UnoWord.app/Contents/MacOS/UnoWord
          otool -L build/UnoWord.app/Contents/MacOS/UnoWord
          # nothing but the system's own frameworks and libraries (dependency
          # lines are the indented ones; a universal binary adds a header
          # line per architecture)
          ! otool -L build/UnoWord.app/Contents/MacOS/UnoWord | grep -E "^[[:space:]]" |
              grep -vE "/System/Library/|/usr/lib/"
      - name: smoke (release)
        working-directory: pc64/uoffice/desktop
        run: tests/smoke.sh "$PWD/build"
      - name: package
        working-directory: pc64/uoffice/desktop/build
        run: cpack -G DragNDrop
      - name: mount the DMG and launch from it
        working-directory: pc64/uoffice/desktop/build
        run: |
          mnt=$(hdiutil attach -nobrowse -readonly UnoOffice-*.dmg | tail -1 | cut -f3-)
          ls -la "$mnt"
          test -L "$mnt/Applications"
          for a in UnoWord UnoCalc UnoShow; do
            codesign --verify --deep --strict "$mnt/$a.app"
            "$mnt/$a.app/Contents/MacOS/$a" --shot "/tmp/$a.ppm"
            test -s "/tmp/$a.ppm"
            plutil -lint "$mnt/$a.app/Contents/Info.plist"
          done
          # the document types Finder's Open With and a double click read
          test "$(plutil -extract CFBundleDocumentTypes.0.LSItemContentTypes.0 raw "$mnt/UnoWord.app/Contents/Info.plist")" = com.microsoft.word.doc
          test "$(plutil -extract CFBundleDocumentTypes.1.LSItemContentTypes.0 raw "$mnt/UnoCalc.app/Contents/Info.plist")" = org.openxmlformats.spreadsheetml.sheet
          # a document handed over the way Finder does it - an Apple event,
          # not argv - is opened (the script fails the run if not)
          cp ../smoke-out/docs/Document1.doc /tmp/Document1.doc
          open -W --stderr /tmp/assoc.log -a "$mnt/UnoWord.app" /tmp/Document1.doc \
               --args --script "$PWD/../tests/assoc_word.txt"
          cat /tmp/assoc.log
          ! grep -q FAIL /tmp/assoc.log
          hdiutil detach "$mnt"
      - uses: actions/upload-artifact@v4
        with:
          name: UnoOffice-macos
          path: pc64/uoffice/desktop/build/UnoOffice-*.dmg

  # -------------------------------------------------------------- release ----
  release:
    if: startsWith(github.ref, 'refs/tags/uoffice-v')
    needs: [linux, rpm-install, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: the tag must match project(VERSION)
        run: |
          want=$(sed -n 's/^project(UnoOffice VERSION \([0-9.]*\).*/\1/p' pc64/uoffice/desktop/CMakeLists.txt)
          got=${GITHUB_REF_NAME#uoffice-v}
          [ "$want" = "$got" ] || { echo "::error::tag says $got, CMakeLists.txt says $want"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          ver=${GITHUB_REF_NAME#uoffice-v}
          cat > notes.md <<NOTES
          UnoWord, UnoCalc and UnoShow as native desktop apps, version $ver.

          | OS | download |
          |---|---|
          | Windows 10/11 x64 | \`UnoOffice-$ver-windows-x64.exe\` (installer) or \`.zip\` (portable) |
          | macOS 11+ (Apple silicon + Intel) | \`UnoOffice-$ver-macos-universal.dmg\` |
          | Debian / Ubuntu 22.04+ | \`unooffice_${ver}_amd64.deb\` |
          | Fedora / RHEL / openSUSE | \`unooffice-$ver-1.x86_64.rpm\` |
          | other Linux | \`UnoOffice-$ver-linux-x86_64.tar.gz\` |

          The builds are not code-signed: on Windows choose *More info > Run anyway*,
          on macOS right-click the app > *Open* the first time.
          See [the README](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/pc64/uoffice/desktop/README.md).
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" \
             --title "UnoOffice $ver" --notes-file notes.md
